databases:
  - name: credi-kart-db
    plan: free
    databaseName: credikart
    user: credikart

services:
  - type: web
    name: credi-kart
    plan: free
    runtime: python
    buildCommand: './build.sh'
    startCommand: 'python -m gunicorn core.asgi:application -k uvicorn.workers.UvicornWorker'
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: credi-kart-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: 'False'
      - key: WEB_CONCURRENCY
        value: 4
